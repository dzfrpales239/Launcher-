name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: yes | sdkmanager --licenses || true
      - run: unzip -o ./*.zip
      - run: |
          sed -i -E 's/set(Accent|Columns|IconSize|Dim)\(/update\1(/g' app/src/main/java/com/example/launcher/MainActivity.kt
        working-directory: Launcher
      - run: gradle assembleDebug
        working-directory: Launcher
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          path: Launcher/app/build/outputs/apk/debug/app-debug.apk
